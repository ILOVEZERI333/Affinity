---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: affinity-operator
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.tony
  resources:
  - distributedscrapers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - infra.tony
  resources:
  - distributedscrapers/status
  verbs:
  - get
  - patch
  - update
